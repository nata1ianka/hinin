<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hinin — официальный сайт</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at center, #2c1a04 0%, #0c0802 100%);
            color: #fffbfa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        .container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            animation: fadeIn 1.2s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid #e5a93b;
            box-shadow: 0 0 25px rgba(229, 169, 59, 0.3);
            margin-bottom: 20px;
            object-fit: cover;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #fffbfa;
        }
        .subtitle {
            font-size: 1rem;
            color: #d1b894;
            margin-bottom: 35px;
            font-weight: 300;
            line-height: 1.5;
        }
        .links-area { display: flex; flex-direction: column; gap: 16px; }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            text-decoration: none;
            color: #fff;
            background: rgba(229, 169, 59, 0.08);
            border: 1px solid rgba(229, 169, 59, 0.4);
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .btn:hover {
            background: rgba(229, 169, 59, 0.25);
            border-color: #e5a93b;
            box-shadow: 0 0 15px rgba(229, 169, 59, 0.2);
            transform: scale(1.02);
        }
        .btn-primary {
            background: rgba(229, 169, 59, 0.2);
            border-color: #e5a93b;
            font-weight: 500;
            box-shadow: 0 0 20px rgba(229, 169, 59, 0.15);
        }
        .btn-primary:hover {
            background: #e5a93b;
            color: #0c0802;
            box-shadow: 0 0 25px rgba(229, 169, 59, 0.4);
        }
        .footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: rgba(209, 184, 148, 0.4);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Аватарка (пока красивая заглушка, позже вставим вашу свечу) -->
        <img src="https://unsplash.com" alt="hinin" class="avatar">
        
        <h1>hinin</h1>
        <div class="subtitle">независимый музыкальный инди-проект<br>лирика • музыка • поток</div>
        
        <div class="links-area">
            <!-- Главная кнопка пресейва -->
            <a href="https://band.link" target="_blank" class="btn btn-primary">Пресейв сингла «жаль» (23.10) 🌙</a>
            
            <!-- Остальные ссылки -->
            <a href="https://youtube.com" target="_blank" class="btn">YouTube-канал 🎵</a>
            <a href="https://instagram.com" target="_blank" class="btn">Instagram 📸</a>
        </div>
        
        <div class="footer">© 2026 hinin music</div>
    </div>

</body>
</html>
